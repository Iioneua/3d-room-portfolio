<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A cozy 3D room. Every corner says something about me." />
    <title>My Room</title>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="labels"></div>

    <header class="brand">
      <span class="brand-name" id="brand-name"></span>
      <span class="brand-role" id="brand-role"></span>
    </header>

    <button id="sound" type="button" aria-pressed="true">Sound on</button>
    <p id="hint">Drag to look around · Click an object to walk over to it</p>
    <button id="back" type="button">← Step back</button>

    <aside id="card" aria-live="polite">
      <p class="card-kicker" id="card-kicker"></p>
      <h2 id="card-title"></h2>
      <p class="card-body" id="card-body"></p>
      <ul id="card-items"></ul>
      <a id="card-link" target="_blank" rel="noopener"></a>
      <p class="card-hint" id="card-hint"></p>
    </aside>

    <div id="intro">
      <div class="intro-inner">
        <p class="intro-kicker" id="intro-role"></p>
        <h1 id="intro-title"></h1>
        <p class="intro-tagline" id="intro-tagline"></p>
        <button id="enter" type="button">Enter the room</button>
        <p class="intro-note">Best with sound on</p>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
