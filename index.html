<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Dusk Desk: a 3D room at dusk where you focus with your friends and take your breaks together." />
    <title>Dusk Desk</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap"
    />
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="labels"></div>
    <button id="computer-pill" type="button">Start a focus session</button>

    <header class="brand">
      <p class="brand-name" id="brand-name"></p>
      <p class="brand-tagline" id="brand-tagline"></p>
      <nav class="pills" id="pills" aria-label="Places in the room"></nav>
    </header>

    <button id="sound" type="button" aria-pressed="true">Sound on</button>
    <p id="hint">Drag to look around · Click an object to walk over to it</p>
    <button id="back" type="button" aria-label="Step back">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
      </svg>
    </button>

    <aside id="card" aria-live="polite">
      <button id="card-close" type="button" aria-label="Close">
        <svg viewBox="0 0 24 24" width="12" height="12" aria-hidden="true">
          <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" />
        </svg>
      </button>
      <p class="card-kicker" id="card-kicker"></p>
      <h2 id="card-title"></h2>
      <p class="card-body" id="card-body"></p>
      <ul id="card-items"></ul>
      <a id="card-link" target="_blank" rel="noopener"></a>
      <p class="card-hint" id="card-hint"></p>
    </aside>

    <div id="intro">
      <div class="intro-inner">
        <p class="intro-kicker" id="intro-role"></p>
        <h1 id="intro-title"></h1>
        <p class="intro-tagline" id="intro-tagline"></p>
        <button id="enter" type="button">Enter the room</button>
        <p class="intro-note">Best with sound on</p>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
